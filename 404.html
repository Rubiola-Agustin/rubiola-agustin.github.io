<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Agustín Rubiola</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101319">
<!-- rutas absolutas: GitHub Pages sirve este archivo en cualquier URL inexistente -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101319;
    --paper:#f6f4ef;
    --coral:#ff5e4d;
    --grey-on-ink:#8a909a;
    --grey-line-dk:#2a2f3a;
    --r:2px;
    --pad:clamp(1.25rem, 5vw, 6rem);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    background:var(--ink);color:var(--paper);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:var(--r)}
  .nav{padding:1.1rem var(--pad)}
  .logo{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
  .logo span{color:var(--coral)}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4rem var(--pad);position:relative;overflow:hidden}
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(var(--grey-line-dk) 1px,transparent 1px),linear-gradient(90deg,var(--grey-line-dk) 1px,transparent 1px);
    background-size:64px 64px;opacity:.25;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 30% 40%,#000,transparent 75%);
            mask-image:radial-gradient(ellipse 80% 60% at 30% 40%,#000,transparent 75%);
  }
  .inner{position:relative;max-width:1200px;width:100%;margin:0 auto}
  .code{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.8rem;letter-spacing:.16em;color:var(--coral)}
  h1{font-family:"Bricolage Grotesque";font-weight:700;font-size:clamp(2.4rem,8vw,5.5rem);letter-spacing:-.03em;line-height:.98;margin-top:1.2rem}
  h1 em{font-style:normal;color:var(--coral)}
  p{margin-top:1.6rem;max-width:46ch;color:#c3c8d0}
  .btn{
    display:inline-flex;margin-top:2.2rem;
    font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.82rem;letter-spacing:.03em;
    padding:.85rem 1.4rem;border-radius:var(--r);background:var(--coral);color:var(--ink);
    transition:background .18s,transform .18s;
  }
  .btn:hover{background:#fff;transform:translateY(-2px)}
  footer{padding:2rem var(--pad);border-top:1px solid var(--grey-line-dk);color:var(--grey-on-ink);font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.7rem;letter-spacing:.06em}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="nav">
  <a href="/" class="logo" aria-label="Agustín Rubiola, ir al inicio">AR<span>.</span></a>
</header>
<main>
  <div class="grid"></div>
  <div class="inner">
    <p class="code">ERROR 404</p>
    <h1>Esta página<br><em>no existe</em>.</h1>
    <p>Puede que el link esté mal escrito o que la página se haya movido.</p>
    <a class="btn" href="/"><span aria-hidden="true">←</span>&nbsp;Volver al inicio</a>
  </div>
</main>
<footer>© 2026 AGUSTÍN RUBIOLA · ARROYITO, CÓRDOBA</footer>
</body>
</html>
